# fly.toml app configuration file generated for mlasneh-presence-y8ejig on 2026-09-06T00:02:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mlasneh-presence-y8ejig'
primary_region = 'ams'

[build]

[env]
  ALLOWED_ORIGINS = 'https://mlasneh.it,https://www.mlasneh.it'
  CLEANUP_INTERVAL_MS = '5000'
  MAX_CLOCK_SKEW_MS = '300000'
  PORT = '8080'
  PRESENCE_TTL_MS = '45000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 800
    soft_limit = 500

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
